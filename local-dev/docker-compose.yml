# TPT Full Stack — Docker Compose
#
# Assumes sibling directory layout:
#   ~/your-workspace/
#     tpt/                  ← this repo (run `docker compose` from here)
#     tpt-backend/
#     tpt-frontend/
#     tpt-data-collector/
#
# Prerequisites:
#   - gcloud auth login && gcloud auth configure-docker europe-north1-docker.pkg.dev
#   - NODE_AUTH_TOKEN env var set (GitHub PAT with read:packages)
#   - WireMock stubs generated: ./scripts/generate-mocks.sh (requires nais login)
#     bootstrap.sh enforces this automatically — running Mode B without stubs aborts early.
#
# Start:
#   docker compose up --build
#
# Frontend (via Wonderwall):  http://localhost:3000   ← use this in browser
# Backend API:                http://localhost:8080
# WireMock (mock APIs):       http://localhost:9090
# WireMock admin UI:          http://localhost:9090/__admin/mappings
# Mock IdP:                   http://localhost:8888
# Mock IdP debugger:          http://localhost:8888/azuread/debugger
# Neo4j browser:              http://localhost:7474
#
# Login: visit http://localhost:3000 — Wonderwall redirects to mock login page.
# Enter any username (e.g. "alice") to get a token with that identity.

name: tpt

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tpt
      POSTGRES_USER: tpt
      POSTGRES_PASSWORD: tpt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ---------------------------------------------------------------------------
  # WireMock — mock server for Nais API, GCVE, and Teamkatalogen
  # ---------------------------------------------------------------------------
  # Stubs are generated by scripts/generate-mocks.sh (requires nais login).
  # They are NOT committed to git — run the generator before first use of Mode B.
  # Re-run when you want fresh randomized data or after a schema change.
  # Admin UI: http://localhost:9090/__admin/mappings
  # ---------------------------------------------------------------------------

  wiremock:
    image: wiremock/wiremock:3.13.0
    ports:
      - "9090:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    command: --verbose
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Auth infrastructure
  # ---------------------------------------------------------------------------

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.0
    ports:
      - "8888:8080"
    volumes:
      - ./mock-oauth2-server-config.json:/app/config.json:ro
    healthcheck:
      # Image is distroless — no shell, wget, or curl available.
      # java -version always exits 0 once the JVM is running; start_period
      # gives the HTTP server time to bind before dependants start.
      test: ["CMD", "java", "-version"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Texas sidecar for tpt-backend
  # Handles: token introspection (backend calls POST /api/v1/introspect)
  texas-backend:
    image: ghcr.io/nais/texas:latest
    ports:
      - "3001:3000"
    environment:
      BIND_ADDRESS: "0.0.0.0:3000"
      AZURE_ENABLED: "true"
      AZURE_APP_CLIENT_ID: "tpt-backend-local"
      AZURE_APP_JWK: "${TEXAS_PRIVATE_JWK}"
      AZURE_APP_WELL_KNOWN_URL: "http://mock-oauth2-server:8080/azuread/.well-known/openid-configuration"
    depends_on:
      mock-oauth2-server:
        condition: service_healthy

  # Texas sidecar for tpt-frontend
  # Handles: OBO token exchange (frontend calls POST /api/v1/token/exchange)
  texas-frontend:
    image: ghcr.io/nais/texas:latest
    ports:
      - "3002:3000"
    environment:
      BIND_ADDRESS: "0.0.0.0:3000"
      AZURE_ENABLED: "true"
      AZURE_APP_CLIENT_ID: "tpt-frontend-local"
      AZURE_APP_JWK: "${TEXAS_PRIVATE_JWK}"
      AZURE_APP_WELL_KNOWN_URL: "http://mock-oauth2-server:8080/azuread/.well-known/openid-configuration"
    depends_on:
      mock-oauth2-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # TPT Applications
  # ---------------------------------------------------------------------------

  tpt-backend:
    build:
      context: ../../tpt-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./dummy-nais-token:/local-dev/dummy-nais-token:ro
    environment:
      # Auth — points to Texas sidecar
      NAIS_TOKEN_INTROSPECTION_ENDPOINT: "http://texas-backend:3000/api/v1/introspect"
      NAIS_TOKEN_ENDPOINT: "http://texas-backend:3000/api/v1/token"
      # Texas uses AZURE_APP_CLIENT_ID to identify this app's audience
      AZURE_APP_CLIENT_ID: "tpt-backend-local"
      # Nais API — served by WireMock, stub files in local-dev/wiremock/mappings/nais/
      NAIS_API_URL: "http://wiremock:8080/nais/query"
      # Token file — WireMock ignores the Authorization header value entirely
      NAIS_SERVICE_ACCOUNT_TOKEN_PATH: "/local-dev/dummy-nais-token"
      # Database — Nais normally auto-injects this
      NAIS_DATABASE_TPT_BACKEND_TPT_JDBC_URL: "jdbc:postgresql://postgres:5432/tpt?user=tpt&password=tpt"
      # Teamkatalogen — served by WireMock, stub files in local-dev/wiremock/mappings/teamkatalogen/
      TEAMKATALOGEN_URL: "http://wiremock:8080/teamkatalogen"
      # Kafka
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "tpt.sync-commands"
      # GCVE enrichment — served by WireMock, stub files in local-dev/wiremock/mappings/gcve/
      GCVE_API_URL: "http://wiremock:8080/gcve"
      GCVE_API_KEY: ""
      # Cluster name (disables leader election in compose — single instance)
      NAIS_CLUSTER_NAME: "local"
      # Admin groups — UUID injected by mock-oauth2-server into the groups claim
      ADMIN_GROUPS: "00000000-0000-0000-0000-000000000001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      texas-backend:
        condition: service_started

  tpt-frontend:
    build:
      context: ../../tpt-frontend
      dockerfile: Dockerfile
      secrets:
        - source: node_auth_token
          target: NODE_AUTH_TOKEN
    ports:
      - "3100:3000"
    environment:
      # Auth — @navikt/oasis + @navikt/texas read these to validate tokens and do OBO exchange
      NAIS_TOKEN_ENDPOINT: "http://texas-frontend:3000/api/v1/token"
      NAIS_TOKEN_EXCHANGE_ENDPOINT: "http://texas-frontend:3000/api/v1/token/exchange"
      NAIS_TOKEN_INTROSPECTION_ENDPOINT: "http://texas-frontend:3000/api/v1/introspect"
      AZURE_APP_CLIENT_ID: "tpt-frontend-local"
      AZURE_OPENID_CONFIG_ISSUER: "http://localhost:8888/azuread"
      AZURE_OPENID_CONFIG_JWKS_URI: "http://mock-oauth2-server:8080/azuread/jwks"
      # Backend
      TPT_BACKEND_URL: "http://tpt-backend:8080"
      TPT_BACKEND_SCOPE: "api://tpt-backend-local/.default"
      # Telemetry — disabled locally
      TELEMETRY_URL: ""
      NODE_ENV: "production"
    depends_on:
      tpt-backend:
        condition: service_started
      texas-frontend:
        condition: service_started

  # Wonderwall sits in front of tpt-frontend and handles OIDC login
  # Browser entry point: http://localhost:3000
  wonderwall:
    image: ghcr.io/nais/wonderwall:latest
    ports:
      - "3000:3000"
    command: >
      --openid.client-id=tpt-frontend-local
      --openid.client-secret=not-used
      --openid.well-known-url=http://localhost:8888/azuread/.well-known/openid-configuration
      --ingress=http://localhost:3000
      --bind-address=0.0.0.0:3000
      --upstream-host=tpt-frontend:3000
      --cookie.secure=false
      --auto-login=true
      --log-level=debug
      --log-format=text
      --upstream-access-logs
      --encryption-key=Zj5cg0U9kNwaz74ZB29i9/tI75GVRD52kULk4iKkU40= # gitleaks:allow
    extra_hosts:
      # Allows Wonderwall to reach mock-oauth2-server via 'localhost'
      # so that browser redirects (which use localhost:8888) and container
      # internal calls share the same issuer URL.
      - "localhost:host-gateway"
    depends_on:
      mock-oauth2-server:
        condition: service_healthy
      tpt-frontend:
        condition: service_started

  tpt-data-collector:
    build:
      context: ../../tpt-data-collector
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      # Kafka
      KAFKA_BROKERS: "kafka:9092"
      TPT_TOPIC: "tpt.github-data"
      # Neo4j / Cartography
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password"
      # GitHub App — dummy values, webhook processing will fail without real credentials
      # Set real values in .env if testing webhook integration
      GITHUB_APP_ID: "${GITHUB_APP_ID:-dummy}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID:-dummy}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-dummy}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-local-webhook-secret}"
      # Azure AD — for validating tokens from tpt-backend calling /team/{slug}
      AZURE_OPENID_CONFIG_ISSUER: "http://mock-oauth2-server:8080/azuread"
      AZURE_APP_CLIENT_ID: "tpt-data-collector-local"
      AZURE_OPENID_CONFIG_JWKS_URI: "http://mock-oauth2-server:8080/azuread/jwks"
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
